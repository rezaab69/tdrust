[package]
name = "group-bot"
description = "A multilingual Telegram group management bot built with tdrust, PostgreSQL and Redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
dotenvy = "0.15"
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "aio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json"] }
tdrust = { path = "../tdrust" }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
